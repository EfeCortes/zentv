        #gallery-container {
            position: fixed;

            width: 100%; height: 100%;
            z-index: 1;
            background: #000;
        }

        /* Sistema de capas optimizado para fundido encadenado continuo */
        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 3s ease-in-out;
            filter: brightness(0.65) contrast(1.1);
            z-index: 1;
        }

        .slide-active {
            opacity: 1;
            z-index: 3; /* Se desvanece suavemente sobre la capa de soporte */
        }

        .slide-behind {
            opacity: 1 !important;
            z-index: 2; /* Capa estática de soporte para evitar fondos negros intermedios */
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, 
                rgba(0,0,0,0.7) 0%, 
                rgba(0,0,0,0) 20%,

        function isWeekendOrHoliday() {
            const d = new Date();
            const day = d.getDay(); // 0 = Domingo, 6 = Sábado
            const month = d.getMonth() + 1; // 1-12
            const date = d.getDate(); // 1-31
            const year = d.getFullYear();

            // Lógica normal
            if (day === 0 || day === 6) {
                return { type: 'weekend', label: 'FIN DE SEMANA' };
            }

            if (month === 1 && date === 1) return { type: 'holiday', label: 'FERIADO • AÑO NUEVO' };
            if (month === 1 && date === 22) return { type: 'holiday', label: 'FERIADO • ESTADO PLURINACIONAL' };
            if (month === 5 && date === 1) return { type: 'holiday', label: 'FERIADO • DÍA DEL TRABAJO' };
            if (month === 6 && date === 21) return { type: 'holiday', label: 'FERIADO • AÑO NUEVO ANDINO' };
            if (month === 8 && date === 6) return { type: 'holiday', label: 'FERIADO • DÍA DE LA PATRIA' };
            if (month === 9 && date === 14) return { type: 'holiday', label: 'FERIADO • COCHABAMBA' };
            if (month === 11 && date === 2) return { type: 'holiday', label: 'FERIADO • TODOS SANTOS' };
            if (month === 12 && date === 25) return { type: 'holiday', label: 'FERIADO • NAVIDAD' };

            if (year === 2026) {
                if (month === 2 && (date === 16 || date === 17)) return { type: 'holiday', label: 'FERIADO • CARNAVAL' };
                if (month === 4 && date === 3) return { type: 'holiday', label: 'FERIADO • VIERNES SANTO' };
                if (month === 6 && date === 4) return { type: 'holiday', label: 'FERIADO • CORPUS CHRISTI' };
            }

            return null;
        }

            if (month === 5 && date === 1) return { title: "Día Internacional de los Trabajadores: Homenaje a la histórica lucha por los derechos laborales, la jornada de ocho horas y condiciones justas en todo el mundo.", source: "Efemérides Globales", date: "HISTORIA • 1 DE MAYO" };
            if (month === 5 && date === 27) return { title: "Homenaje a las Heroínas de la Coronilla (1812) en la colina de San Sebastián de Cochabamba: Símbolo eterno de valor por la independencia patria.", source: "Día de la Madre Boliviana", date: "HISTORIA • 27 DE MAYO" };
            if (month === 6 && date === 14) return { title: "Día de la Paz del Chaco: Se conmemora la histórica firma del cese de hostilidades (1935), uniendo a los pueblos de Bolivia y Paraguay.", source: "Efemérides de Bolivia", date: "HISTORIA • 14 DE JUNIO" };
            if (month === 6 && date === 21) return { title: "Año Nuevo Andino Amazónico Chaqueño (Willka Kuti): Celebración del solsticio de invierno y el retorno vivificante de la energía solar en los Andes.", source: "Feriado de Bolivia", date: "HISTORIA • 21 DE JUNIO" };
            if (month === 6 && date === 23) return { title: "Víspera de San Juan: Jornada tradicional de preparación, juegos y unión comunitaria en la noche más fría del año en el hemisferio sur.", source: "Efemérides de Bolivia", date: "HISTORIA • 23 DE JUNIO" };
            if (month === 8 && date === 6) return { title: "Día de la Independencia de Bolivia: Conmemoración de la histórica asamblea constituyente de 1825 que declaró la plena soberanía de nuestra República.", source: "Efemérides de Bolivia", date: "HISTORIA • 6 DE AGOSTO" };
            if (month === 9 && date === 14) return { title: "Aniversario de la Revolución de Cochabamba (1810): Conmemoración del valiente levantamiento libertario liderado por Esteban Arze y patriotas locales.", source: "Grito Libertario Cbba", date: "HISTORIA • 14 DE SEPTIEMBRE" };
            if (month === 11 && date === 2) return { title: "Festividad de Todos Santos: Tradición milenaria andina de preparación de mesas florales y panes rituales para recibir a las almas de nuestros ancestros.", source: "Efemérides de Bolivia", date: "HISTORIA • 2 DE NOVIEMBRE" };
            if (month === 12 && date === 25) return { title: "Celebración del nacimiento espiritual en los hogares, invocando el cese de conflictos, la generosidad comunitaria y el perdón mutuo entre seres humanos.", source: "Feriado de Navidad", date: "HISTORIA • 25 DE DICIEMBRE" };

            return null;
        }

        function prepareQuotes() {
            const shuffledModels = mentalModels.sort(() => 0.5 - Math.random());
            const shuffledClassics = classicQuotes.sort(() => 0.5 - Math.random());
            
            dailyQuotes = [];
            let mIdx = 0;
            let cIdx = 0;
            
            while (mIdx < shuffledModels.length || cIdx < shuffledClassics.length) {
                for (let i = 0; i < 3; i++) {
                    if (mIdx < shuffledModels.length) {
                        dailyQuotes.push(shuffledModels[mIdx++]);
                    }
                }
                if (cIdx < shuffledClassics.length) {
                    dailyQuotes.push(shuffledClassics[cIdx++]);
                }
            }
        }

        const fallbackHeadlines = [
            { title: "El telescopio James Webb descubre detalles inéditos sobre la formación de las primeras galaxias", source: "ASTRONOMÍA", date: "HOY" },
            { title: "Avances en energía de fusión marcan un nuevo hito de estabilidad y eficiencia en reactores", source: "CIENCIA", date: "HOY" },
            { title: "Nuevas investigaciones en Tiwanaku revelan sistemas avanzados de gestión hídrica prehispánica", source: "HISTORIA", date: "HOY" },
            { title: "La inteligencia artificial acelera el descubrimiento de nuevos materiales para baterías sostenibles", source: "TECNOLOGÍA", date: "HOY" },
            { title: "El Parque Nacional Madidi es ratificado entre los ecosistemas con mayor biodiversidad del planeta", source: "NATURALEZA", date: "HOY" }
        ];

        function fetchAllNews() {
            const dateStatus = isWeekendOrHoliday();
            const headerEl = document.getElementById('noticias-header');
            if (headerEl) {
                if (dateStatus) {
                    headerEl.innerText = `CRÓNICA • ${dateStatus.label}`;
                } else {
                    headerEl.innerText = "CRÓNICA • ÚLTIMAS NOTICIAS";
                }
            }

            newsHeadlines = [];

            const dailyComm = getDailyCommemoration();
            if (dailyComm) {
                newsHeadlines.push(dailyComm);
                rotateNews();
            }

            // Llamada al endpoint optimizado de Netlify Functions
            fetch('/api/news')
                .then(r => {
                    if (!r.ok) throw new Error("HTTP " + r.status);
                    return r.json();
                })
                .then(articles => {
                    if (articles && articles.length > 0) {
                        const formatted = articles.map(a => ({
                            title: a.title,
                            source: a.source,
                            date: formatSafeDate(a.date)
                        }));
                        newsHeadlines = newsHeadlines.concat(formatted);

                        const currentTitle = document.getElementById('noticia-title').innerText;
                        if (currentTitle.includes("Buscando") || currentTitle.includes("Sincronizando") || currentTitle.includes("Conectando")) {
                            rotateNews();
                        }
                    }
                })
                .catch(err => {
                    console.warn("No se pudo conectar con /api/news, usando respaldo local:", err);
                    if (newsHeadlines.length === 0) {
                        newsHeadlines = fallbackHeadlines;
                        rotateNews();
                    }
                });

            // Seguro de respaldo si transcurren 5s sin noticias
            setTimeout(() => {
                if (newsHeadlines.length === 0) {
                    newsHeadlines = fallbackHeadlines;
                    rotateNews();
                }
            }, 5000);
        }

        function formatSafeDate(dStr) {
            try {
                if (!dStr || dStr === "RECIENTE" || dStr === "HOY") return "RECIENTE";
                const d = new Date(dStr);
                if (isNaN(d.getTime())) return "RECIENTE";
                return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }) + " • " + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', hour12: false });
            } catch (e) { return "RECIENTE"; }
        }

        function cycleGallery() {
            if(activeGallery.length === 0) return;
            currentGalIdx = (currentGalIdx + 1) % activeGallery.length;
            const art = activeGallery[currentGalIdx];
            const divA = document.getElementById('slide-A');
            const divB = document.getElementById('slide-B');
            const info = document.getElementById('info-obra');

            const tempImg = new Image();
            tempImg.onload = function() {
                if(activeSlide === 'A') {
                    divB.style.backgroundImage = `url('${art.url}')`;
                    divB.className = 'slide slide-active'; 
                    divA.className = 'slide slide-behind'; 
                    activeSlide = 'B';
                    
                    setTimeout(() => {
                        if (activeSlide === 'B') {
                            divA.className = 'slide'; 
                        }
                    }, 3200);
                } else {
                    divA.style.backgroundImage = `url('${art.url}')`;
                    divA.className = 'slide slide-active'; 
                    divB.className = 'slide slide-behind'; 
                    activeSlide = 'A';
                    
                    setTimeout(() => {
                        if (activeSlide === 'A') {
                            divB.className = 'slide'; 
                        }
                    }, 3200);
                }
                
                info.style.opacity = 0;
                setTimeout(() => {
                    info.innerText = art.title + " • " + art.author;
                    info.style.opacity = 0.5;
                }, 1000);
            };

            tempImg.onerror = function() {
                console.warn("Error cargando fondo de arte, saltando al siguiente de inmediato:", art.url);
                setTimeout(cycleGallery, 200); 
            };
            tempImg.src = art.url;
        }

        function rotateQuotes() {
            const disp = document.getElementById('quote-display');
            const auth = document.getElementById('quote-author');
            if(dailyQuotes.length === 0) return;
            
            disp.style.opacity = 0; auth.style.opacity = 0;
            setTimeout(() => {
                const q = dailyQuotes[quoteIdx];
                disp.innerText = q[languages[langIdx]];
                auth.innerText = q.author.toUpperCase();
                disp.style.opacity = 1; auth.style.opacity = 1;
                
                langIdx++;
                if(langIdx >= languages.length) { 
                    langIdx = 0; 
                    quoteIdx = (quoteIdx + 1) % dailyQuotes.length; 
                }
            }, 1000);
        }

        function rotateNews() {
            const display = document.getElementById('noticia-display');
            const titleEl = document.getElementById('noticia-title');
            const dateEl = document.getElementById('noticia-fecha');
            const fuenteEl = document.getElementById('noticia-fuente');
            
            if (!newsHeadlines || newsHeadlines.length === 0) return;
            
            display.style.opacity = 0; fuenteEl.style.opacity = 0;
            setTimeout(() => {
                if (!newsHeadlines || newsHeadlines.length === 0) {
                    titleEl.innerText = "Sincronizando noticias...";
                    dateEl.innerText = "AL MOMENTO";
                    fuenteEl.innerText = "ZEN DASH";
                    display.style.opacity = 1; fuenteEl.style.opacity = 1;
                    return;
                }

                if (newsIndex >= newsHeadlines.length) {
                    newsIndex = 0;
                }

                const n = newsHeadlines[newsIndex];
                if (n) {
                    dateEl.innerText = n.date || "RECIENTE";
                    titleEl.innerText = n.title || "";
                    fuenteEl.innerText = (n.source || "INFO").toUpperCase();
                    newsIndex = (newsIndex + 1) % newsHeadlines.length;
                }
                
                display.style.opacity = 1; fuenteEl.style.opacity = 1;
            }, 800); 
        }

        function prepareGallery() {
            const shuffledPriority = priorityGallery.sort(() => 0.5 - Math.random());
            const shuffledSecondary = secondaryGallery.sort(() => 0.5 - Math.random());
            activeGallery = shuffledPriority.concat(shuffledSecondary);
        }

        function updateClock() {
            const n = new Date();
            document.getElementById('reloj').innerText = n.toLocaleTimeString('es-BO', {hour:'2-digit', minute:'2-digit', hour12:false});
            document.getElementById('fecha-texto').innerText = n.toLocaleDateString('es-ES', {weekday:'short', day:'numeric', month:'short'}).toUpperCase();
            
            if(lastDay !== n.toDateString()) {
                prepareGallery(); 
                prepareQuotes();  
                lastDay = n.toDateString();
            }
        }

        function fetchWeather() {
            fetch("https://api.open-meteo.com/v1/forecast?latitude=-17.3895&longitude=-66.1568&current=temperature_2m,weather_code&timezone=auto")
            .then(r => r.json()).then(data => {
                if(data.current) {
                    document.getElementById('clima-temp').innerText = Math.round(data.current.temperature_2m) + "°";
                    document.getElementById('clima-desc').innerHTML = "COCHABAMBA<br>" + (data.current.weather_code <= 3 ? "DESPEJADO" : "NUBOSIDAD");
                }
            }).catch(() => {});
        }

        // --- SISTEMA DE ALERTAS MATUTINAS FAMILIARES (7:00 a 7:48, Días de Semana) ---
        const morningMessages = [
            "Deja de leer, come",
            "Apure niña",
            "Hágale caso a sus padres"
        ];
        let nextMorningAlertMs = 0;
        let morningAlertActive = false;

        function playMacAlertSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }
                const t = ctx.currentTime;

                // Síntesis armónica cristalina inspirada en la clásica campana/alerta de Mac ("Glass / Ping")
                const partials = [
                    { f: 987.77, gain: 0.5, decay: 1.1, type: 'sine' },       // Tono principal B5
                    { f: 1975.53, gain: 0.28, decay: 0.8, type: 'sine' },      // Armónico B6
                    { f: 2963.30, gain: 0.15, decay: 0.5, type: 'triangle' },  // F#7
                    { f: 3951.07, gain: 0.08, decay: 0.35, type: 'sine' }      // Brillo superior B7
                ];

                partials.forEach(p => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = p.type;
                    osc.frequency.setValueAtTime(p.f, t);

                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(p.gain, t + 0.015);
                    gain.gain.exponentialRampToValueAtTime(0.0001, t + p.decay);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(t);
                    osc.stop(t + p.decay + 0.1);
                });
            } catch(e) {
                console.warn("Audio no disponible:", e);
            }
        }

        function triggerMorningAlert(customMsg) {
            if (morningAlertActive) return;
            morningAlertActive = true;

            const overlay = document.getElementById('morning-alert');
            const textEl = document.getElementById('morning-alert-text');
            if (!overlay || !textEl) {
                morningAlertActive = false;
                return;
            }

            const msg = customMsg || morningMessages[Math.floor(Math.random() * morningMessages.length)];
            textEl.innerText = msg;

            // Reproducir sonido clásico de alerta
            playMacAlertSound();

            // Activar pantalla negra absoluta con fade-in suave
            overlay.classList.add('active');

            // Mantener visible durante 6 segundos y desvanecer suavemente
            setTimeout(() => {
                overlay.classList.remove('active');
                setTimeout(() => {
                    morningAlertActive = false;
                }, 1000);
            }, 6000);
        }

        function checkMorningAlertSchedule() {
            const now = new Date();
            const day = now.getDay(); // 1 = Lunes ... 5 = Viernes
            const h = now.getHours();
            const m = now.getMinutes();

            // Solo días de semana (L-V) entre 7:00 y 7:48
            const inWindow = (day >= 1 && day <= 5) && (h === 7 && m >= 0 && m <= 48);

            if (!inWindow) {
                nextMorningAlertMs = 0;
                return;
            }

            const currentMs = Date.now();
            if (nextMorningAlertMs === 0) {
                // Programar el primer aviso al azar entre 2 y 7 minutos
                nextMorningAlertMs = currentMs + (Math.floor(Math.random() * 6) + 2) * 60 * 1000;
                return;
            }

            if (currentMs >= nextMorningAlertMs) {
                triggerMorningAlert();
                // Próximo aviso aleatorio entre 6 y 11 minutos
                nextMorningAlertMs = currentMs + (Math.floor(Math.random() * 6) + 6) * 60 * 1000;
            }
        }

        // Atajos para probar en cualquier momento: tecla M, clic en el reloj o doble clic en pantalla
        window.testMorningAlert = triggerMorningAlert;

        document.addEventListener('keydown', (e) => {
            if (e.key === 'm' || e.key === 'M' || e.code === 'KeyM') {
                triggerMorningAlert();
            }
        });

        document.addEventListener('dblclick', () => {
            triggerMorningAlert();
        });

        window.onload = function() {
            var now = new Date();
            lastDay = now.toDateString();
            
            prepareGallery();
            prepareQuotes();

            var img = new Image();
            img.onload = function() {
                const slideA = document.getElementById('slide-A');
                slideA.style.backgroundImage = `url('${activeGallery[0].url}')`;
                slideA.className = 'slide slide-active';
                
                document.getElementById('loader').style.opacity = 0;
                setTimeout(() => { 
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('main-layout').style.opacity = 1;
                }, 1000);
                
                rotateQuotes();
                fetchAllNews();
            };

            img.onerror = function() {
                console.warn("Fallo carga inicial de arte, buscando respaldo.");
                activeGallery.push(activeGallery.shift());
                img.src = activeGallery[0].url;
            };

            img.src = activeGallery[0].url;
            
            setTimeout(() => { if(document.getElementById('loader').style.display !== 'none') img.onload(); }, 6000);

            updateClock();
            fetchWeather();
            checkMorningAlertSchedule();

            const relojEl = document.getElementById('reloj');
            if (relojEl) {
                relojEl.style.cursor = 'pointer';
                relojEl.title = "Haz clic para probar el aviso";
                relojEl.addEventListener('click', () => triggerMorningAlert());
            }
            
            setInterval(updateClock, 1000);
            setInterval(cycleGallery, 45000);
            setInterval(rotateQuotes, 25000);
            setInterval(rotateNews, 30000);
            setInterval(fetchWeather, 30 * 60 * 1000);
            setInterval(fetchAllNews, 15 * 60 * 1000);
            setInterval(checkMorningAlertSchedule, 20000);
        };
    </script>
