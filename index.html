<!DOCTYPE html>

<head>

        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@100;300;500;700;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&display=swap');

        body {
            font-family: 'Montserrat', sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            margin: 0;
        }

        #gallery-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background: #000;
        }

        /* Sistema de capas optimizado para fundido encadenado continuo */
        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 3s ease-in-out;
            filter: brightness(0.65) contrast(1.1);
            z-index: 1;
        }

        .slide-active {
            opacity: 1;
            z-index: 3; /* Se desvanece suavemente sobre la capa de soporte */
        }

        .slide-behind {
            opacity: 1 !important;
            z-index: 2; /* Capa estática de soporte para evitar fondos negros intermedios */
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, 
                rgba(0,0,0,0.7) 0%, 
                rgba(0,0,0,0) 20%, 
                rgba(0,0,0,0) 80%, 
                rgba(0,0,0,0.85) 100%);
            z-index: 5;
            pointer-events: none;
        }

        #main-layout {
            position: relative;
            z-index: 10;
            height: 100vh;
            width: 100vw;
            display: grid;
            grid-template-columns: 1fr 1fr; 
            align-content: center; 
            align-items: stretch; 
            padding: 8vh 10%; 
            box-sizing: border-box;
            gap: 5vw;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        #left-col, #right-col {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #reloj {
            font-size: 11vw; 
            font-weight: 200;
            line-height: 0.85;
            letter-spacing: -0.04em;
            text-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            margin-bottom: 1.5vw;
        }

        #quote-container {
            position: relative;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            min-height: 25vh;
        }

        #quote-display {
            font-family: 'Playfair Display', serif;
            font-size: 2.3vw;
            font-weight: 700;
            font-style: italic;
            line-height: 1.35;
            color: rgba(255, 255, 255, 0.95);
            transition: opacity 1s ease-in-out;
            min-height: 12vw;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
            padding: 0 2vw;
        }

        #quote-author {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7vw;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5em;
            color: rgba(255, 255, 255, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 1.5vw;
            margin-top: 1.5vw;
            width: 100%;
            transition: opacity 1s;
        }

        #noticias-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 2.5vw;
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0,0,0,0.4);
        }

        .noticia-title {
            font-size: 1.7vw; 
            font-weight: 700;
            line-height: 1.4;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        #noticia-fuente {
            margin-top: auto;
            font-size: 0.8vw;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.45);
            text-transform: uppercase;
            letter-spacing: 0.4em;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            height: 4.5vw;
            display: flex;
            align-items: center;
            margin-top: 1.5vw;
            transition: opacity 1s;
        }

        #info-obra {
            position: fixed;
            bottom: 4vh;
            left: 5vw; 
            z-index: 20;
            font-size: 0.7vw;
            font-weight: 600;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 0.3em;
            background: rgba(0,0,0,0.2);
            padding: 8px 18px;
            border-radius: 2px;
            border-left: 3px solid rgba(255,255,255,0.3);
            transition: opacity 1s ease-in-out;
        }

        #loader {
            position: fixed;
            top:0; left:0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1.5s ease-in-out;
        }
    </style>

        // --- SISTEMA DE DETECCIÓN DE FIN DE SEMANA O FERIADOS EN COCHABAMBA (BOLIVIA) ---
        function isWeekendOrHoliday() {
            const d = new Date();
            const day = d.getDay(); // 0 = Domingo, 6 = Sábado
            const month = d.getMonth() + 1; // 1-12
            const date = d.getDate(); // 1-31
            const year = d.getFullYear();

            // --- LÓGICA DE PRUEBA TEMPORAL REQUERIDA (14 Y 15 DE JUNIO DE 2026 ASUMIDOS COMO FERIADO) ---
            if (year === 2026 && month === 6 && (date === 14 || date === 15)) {
                return { type: 'holiday', label: 'FERIADO DE PRUEBA' };
            }

            // Lógica normal para fines de semana ordinarios (se activa a partir del martes 16 de junio de 2026)
            if (day === 0 || day === 6) {
                return { type: 'weekend', label: 'FIN DE SEMANA' };
            }

            // Feriados fijos nacionales de Bolivia y Cochabamba
            if (month === 1 && date === 1) return { type: 'holiday', label: 'FERIADO • AÑO NUEVO' };
            if (month === 1 && date === 22) return { type: 'holiday', label: 'FERIADO • ESTADO PLURINACIONAL' };
            if (month === 5 && date === 1) return { type: 'holiday', label: 'FERIADO • DÍA DEL TRABAJO' };
            if (month === 6 && date === 21) return { type: 'holiday', label: 'FERIADO • AÑO NUEVO ANDINO' };
            if (month === 8 && date === 6) return { type: 'holiday', label: 'FERIADO • DÍA DE LA PATRIA' };
            if (month === 9 && date === 14) return { type: 'holiday', label: 'FERIADO • COCHABAMBA' }; // Aniversario Cbba
            if (month === 11 && date === 2) return { type: 'holiday', label: 'FERIADO • TODOS SANTOS' };
            if (month === 12 && date === 25) return { type: 'holiday', label: 'FERIADO • NAVIDAD' };

            // Feriados variables nacionales de Bolivia calculados para el año en curso (2026)
            if (year === 2026) {
                if (month === 2 && (date === 16 || date === 17)) return { type: 'holiday', label: 'FERIADO • CARNAVAL' };
                if (month === 4 && date === 3) return { type: 'holiday', label: 'FERIADO • VIERNES SANTO' };
                if (month === 6 && date === 4) return { type: 'holiday', label: 'FERIADO • CORPUS CHRISTI' };
            }

            return null;
        }

            }
            if (month === 5 && date === 27) {
                return { title: "Homenaje a las Heroínas de la Coronilla (1812) en la colina de San Sebastián de Cochabamba: Símbolo eterno de valor por la independencia patria.", source: "Día de la Madre Boliviana", date: "HISTORIA • 27 DE MAYO" };
            }
            if (month === 6 && date === 21) {
                return { title: "Año Nuevo Andino Amazónico Chaqueño (Willka Kuti): Celebración del solsticio de invierno y el retorno vivificante de la energía solar en los Andes.", source: "Feriado de Bolivia", date: "HISTORIA • 21 DE JUNIO" };
            }
            if (month === 8 && date === 6) {
                return { title: "Día de la Independencia de Bolivia: Conmemoración de la histórica asamblea constituyente de 1825 que declaró la plena soberanía de nuestra República.", source: "Efemérides de Bolivia", date: "HISTORIA • 6 DE AGOSTO" };
            }
            if (month === 9 && date === 14) {
                return { title: "Aniversario de la Revolución de Cochabamba (1810): Conmemoración del valiente levantamiento libertario liderado por Esteban Arze y patriotas locales.", source: "Grito Libertario Cbba", date: "HISTORIA • 14 DE SEPTIEMBRE" };
            }
            if (month === 11 && date === 2) {
                return { title: "Festividad de Todos Santos: Tradición milenaria andina de preparación de mesas florales y panes rituales para recibir a las almas de nuestros ancestros.", source: "Efemérides de Bolivia", date: "HISTORIA • 2 DE NOVIEMBRE" };
            }
            if (month === 12 && date === 25) {
                return { title: "Celebración del nacimiento espiritual en los hogares, invocando el cese de conflictos, la generosidad comunitaria y el perdón mutuo entre seres humanos.", source: "Feriado de Navidad", date: "HISTORIA • 25 DE DICIEMBRE" };
            }

            return null;
        }

        // --- MEZCLADOR DE PRIORIDAD 3:1 (3 MODELOS POR CADA 1 CLÁSICA) ---
        function prepareQuotes() {
            const shuffledModels = mentalModels.sort(() => 0.5 - Math.random());
            const shuffledClassics = classicQuotes.sort(() => 0.5 - Math.random());
            
            dailyQuotes = [];
            let mIdx = 0;
            let cIdx = 0;
            
            while (mIdx < shuffledModels.length || cIdx < shuffledClassics.length) {
                for (let i = 0; i < 3; i++) {
                    if (mIdx < shuffledModels.length) {
                        dailyQuotes.push(shuffledModels[mIdx++]);
                    }
                }
                if (cIdx < shuffledClassics.length) {
                    dailyQuotes.push(shuffledClassics[cIdx++]);
                }
            }
        }

        // --- MOTOR DE NOTICIAS (ASÍNCRONO E INDEPENDIENTE CON CACHE-BUSTER) ---
        function fetchAllNews() {
            const weekdaySources = [
                { name: "BBC Mundo", url: "https://feeds.bbci.co.uk/mundo/rss.xml" },
                { name: "CNN Español", url: "https://cnnespanol.cnn.com/feed/" },
                { name: "Los Tiempos", url: "https://www.lostiempos.com/rss/portada" },
                { name: "El Deber", url: "https://eldeber.com.bo/rss/portada" }
            ];

            const funSources = [
                { name: "SINC (Ciencia y Positivo)", url: "https://www.agenciasinc.es/rss/feed/all" },
                { name: "National Geographic", url: "https://www.nationalgeographic.com.es/feeder/all" },
                { name: "Yorokobu (Buenas Ideas)", url: "https://www.yorokobu.es/feed/" },
                { name: "Muy Interesante", url: "https://www.muyinteresante.es/rss" },
                { name: "Xataka (Tecnología)", url: "https://www.xataka.com/feed" }
            ];

            const dateStatus = isWeekendOrHoliday();
            const sources = dateStatus ? funSources : weekdaySources;

            const headerEl = document.getElementById('noticias-header');
            if (headerEl) {
                if (dateStatus) {
                    headerEl.innerText = `CRÓNICA • ${dateStatus.label}`;
                } else {
                    headerEl.innerText = "CRÓNICA • ÚLTIMAS NOTICIAS";
                }
            }

            // Inicializar array de titulares de forma limpia para evitar acumulaciones
            newsHeadlines = [];

            // Inyectar Efeméride o conmemoración diaria si existe para que aparezca primero
            const dailyComm = getDailyCommemoration();
            if (dailyComm) {
                newsHeadlines.push(dailyComm);
                // Iniciar rotación visual instantáneamente con la efeméride histórica
                rotateNews();
            }

            const cb = Math.floor(Date.now() / 1800000); // 30 min cache
            
            sources.forEach(s => {
                const api = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(s.url)}&count=10&cb=${cb}`;
                
                fetch(api)
                    .then(r => r.json())
                    .then(data => {
                        if (data.status === 'ok' && data.items && data.items.length > 0) {
                            const newArticles = data.items.map(item => ({
                                title: item.title.replace(/<\/?[^>]+(>|$)/g, "").trim(),
                                source: s.name,
                                date: formatSafeDate(item.pubDate)
                            }));
                            
                            newsHeadlines = newsHeadlines.concat(newArticles);
                            
                            const currentTitle = document.getElementById('noticia-title').innerText;
                            if (currentTitle.includes("Buscando") || currentTitle.includes("Sincronizando")) {
                                rotateNews();
                            }
                        }
                    })
                    .catch(err => console.error("Error obteniendo RSS de:", s.name, err));
            });

            setTimeout(() => {
                if (newsHeadlines.length === 0) {
                    newsHeadlines = [{ title: "Conectando con servidores de noticias...", source: "INFO ZEN", date: "AHORA" }];
                    rotateNews();
                }
            }, 10000);
        }

        function formatSafeDate(dStr) {
            try {
                const d = new Date(dStr.replace(/-/g, '/'));
                if(isNaN(d.getTime())) return "RECIENTE";
                return d.toLocaleDateString('es-ES', {day:'2-digit', month:'short'}) + " • " + d.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit', hour12:false});
            } catch(e) { return "AHORA"; }
        }

        // --- SISTEMA DE GALERÍA EXCLUSIVO CON TRANSICIÓN EXCLUSIVA DE FUNDIDO ENCADENADO ---
        function cycleGallery() {
            if(activeGallery.length === 0) return;
            currentGalIdx = (currentGalIdx + 1) % activeGallery.length;
            const art = activeGallery[currentGalIdx];
            const divA = document.getElementById('slide-A');
            const divB = document.getElementById('slide-B');
            const info = document.getElementById('info-obra');

            const tempImg = new Image();
            tempImg.onload = function() {
                if(activeSlide === 'A') {
                    divB.style.backgroundImage = `url('${art.url}')`;
                    divB.className = 'slide slide-active'; 
                    divA.className = 'slide slide-behind'; 
                    activeSlide = 'B';
                    
                    setTimeout(() => {
                        if (activeSlide === 'B') {
                            divA.className = 'slide'; 
                        }
                    }, 3200);
                } else {
                    divA.style.backgroundImage = `url('${art.url}')`;
                    divA.className = 'slide slide-active'; 
                    divB.className = 'slide slide-behind'; 
                    activeSlide = 'A';
                    
                    setTimeout(() => {
                        if (activeSlide === 'A') {
                            divB.className = 'slide'; 
                        }
                    }, 3200);
                }
                
                info.style.opacity = 0;
                setTimeout(() => {
                    info.innerText = art.title + " • " + art.author;
                    info.style.opacity = 0.5;
                }, 1000);
            };

            tempImg.onerror = function() {
                console.warn("Error cargando fondo de arte, saltando al siguiente de inmediato:", art.url);
                setTimeout(cycleGallery, 200); 
            };
            tempImg.src = art.url;
        }

        function rotateQuotes() {
            const disp = document.getElementById('quote-display');
            const auth = document.getElementById('quote-author');
            if(dailyQuotes.length === 0) return;
            
            disp.style.opacity = 0; auth.style.opacity = 0;
            setTimeout(() => {
                const q = dailyQuotes[quoteIdx];
                disp.innerText = q[languages[langIdx]];
                auth.innerText = q.author.toUpperCase();
                disp.style.opacity = 1; auth.style.opacity = 1;
                
                langIdx++;
                if(langIdx >= languages.length) { 
                    langIdx = 0; 
                    quoteIdx = (quoteIdx + 1) % dailyQuotes.length; 
                }
            }, 1000);
        }

        // --- ROTACIÓN SEGUIDA DE NOTICIAS ---
        function rotateNews() {
            const display = document.getElementById('noticia-display');
            const titleEl = document.getElementById('noticia-title');
            const dateEl = document.getElementById('noticia-fecha');
            const fuenteEl = document.getElementById('noticia-fuente');
            
            if (!newsHeadlines || newsHeadlines.length === 0) return;
            
            display.style.opacity = 0; fuenteEl.style.opacity = 0;
            setTimeout(() => {
                if (!newsHeadlines || newsHeadlines.length === 0) {
                    titleEl.innerText = "Sincronizando noticias...";
                    dateEl.innerText = "AL MOMENTO";
                    fuenteEl.innerText = "ZEN DASH";
                    display.style.opacity = 1; fuenteEl.style.opacity = 1;
                    return;
                }

                if (newsIndex >= newsHeadlines.length) {
                    newsIndex = 0;
                }

                const n = newsHeadlines[newsIndex];
                if (n) {
                    dateEl.innerText = n.date || "RECIENTE";
                    titleEl.innerText = n.title || "";
                    fuenteEl.innerText = (n.source || "INFO").toUpperCase();
                    newsIndex = (newsIndex + 1) % newsHeadlines.length;
                }
                
                display.style.opacity = 1; fuenteEl.style.opacity = 1;
            }, 800); 
        }

        function prepareGallery() {
            const shuffledPriority = priorityGallery.sort(() => 0.5 - Math.random());
            const shuffledSecondary = secondaryGallery.sort(() => 0.5 - Math.random());
            activeGallery = shuffledPriority.concat(shuffledSecondary);
        }

        function updateClock() {
            const n = new Date();
            document.getElementById('reloj').innerText = n.toLocaleTimeString('es-BO', {hour:'2-digit', minute:'2-digit', hour12:false});
            document.getElementById('fecha-texto').innerText = n.toLocaleDateString('es-ES', {weekday:'short', day:'numeric', month:'short'}).toUpperCase();
            
            if(lastDay !== n.toDateString()) {
                prepareGallery(); 
                prepareQuotes();  
                lastDay = n.toDateString();
            }
        }

        function fetchWeather() {
            fetch("https://api.open-meteo.com/v1/forecast?latitude=-17.3895&longitude=-66.1568&current=temperature_2m,weather_code&timezone=auto")
            .then(r => r.json()).then(data => {
                if(data.current) {
                    document.getElementById('clima-temp').innerText = Math.round(data.current.temperature_2m) + "°";
                    document.getElementById('clima-desc').innerHTML = "COCHABAMBA<br>" + (data.current.weather_code <= 3 ? "DESPEJADO" : "NUBOSIDAD");
                }
            }).catch(() => {});
        }

        window.onload = function() {
            var now = new Date();
            lastDay = now.toDateString();
            
            prepareGallery();
            prepareQuotes();

            var img = new Image();
            img.onload = function() {
                const slideA = document.getElementById('slide-A');
                slideA.style.backgroundImage = `url('${activeGallery[0].url}')`;
                slideA.className = 'slide slide-active';
                
                document.getElementById('loader').style.opacity = 0;
                setTimeout(() => { 
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('main-layout').style.opacity = 1;
                }, 1000);
                
                rotateQuotes();
                fetchAllNews();
            };

            img.onerror = function() {
                console.warn("Fallo carga inicial de arte, buscando respaldo.");
                activeGallery.push(activeGallery.shift());
                img.src = activeGallery[0].url;
            };

            img.src = activeGallery[0].url;
            
            setTimeout(() => { if(document.getElementById('loader').style.display !== 'none') img.onload(); }, 6000);

            updateClock();
            fetchWeather();
            
            setInterval(updateClock, 1000);
            setInterval(cycleGallery, 45000);
            setInterval(rotateQuotes, 25000);
            setInterval(rotateNews, 30000);
            setInterval(fetchWeather, 30 * 60 * 1000);
            setInterval(fetchAllNews, 15 * 60 * 1000); 
        };
    </script>
</body>
