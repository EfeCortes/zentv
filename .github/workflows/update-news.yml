name: Actualizar Noticias

on:
  schedule:
    # Ejecutar cada hora en punto
    - cron: '0 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub
  push:
    branches:
      - main
    paths:
      - 'scripts/**'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Obtener últimas noticias
        run: node scripts/update-news.mjs

      - name: Guardar cambios si hay noticias nuevas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --staged --quiet; then
            echo "Sin cambios en las noticias."
          else
            git commit -m "Auto-update news.json [skip ci]"
            git push
          fi
